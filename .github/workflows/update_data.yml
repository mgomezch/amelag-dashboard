name: Check and Update AMELAG Wastewater Data

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync regardless of recorded commit'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream_update]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for New Commits and Sync Data
        id: sync
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          # Check if upstream repository has new commits
          set +e
          python scripts/check_upstream.py --check
          CHECK_CODE=$?
          set -e

          if [ $CHECK_CODE -eq 0 ] && [ -z "$FORCE_FLAG" ]; then
            echo "Upstream is already up to date. No sync needed."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New upstream commits detected (or force requested). Synchronizing data..."
          python scripts/check_upstream.py --sync $FORCE_FLAG

          UPSTREAM_SHA=$(cat data/upstream_commit.txt | tr -d '[:space:]')
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html en.html en/ amelag_aggregierte_kurve.tsv
          if git diff --staged --quiet; then
            echo "No file changes detected."
          else
            UPSTREAM_SHORT=$(head -c 7 data/upstream_commit.txt)
            git commit -m "chore(data): auto-update from RKI AMELAG (upstream commit $UPSTREAM_SHORT)"
            git push
          fi

  deploy:
    needs: check-and-update
    if: needs.check-and-update.outputs.has_changes == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Updated Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
