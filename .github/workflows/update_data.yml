name: Update AMELAG Wastewater Data

on:
  schedule:
    # Run every Thursday at 06:00 UTC (RKI typically updates Wednesday afternoon/evening)
    - cron: '0 6 * * 4'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Latest Data from RKI AMELAG
        run: |
          curl -s -L -o amelag_aggregierte_kurve.tsv https://raw.githubusercontent.com/robert-koch-institut/Abwassersurveillance_AMELAG/main/amelag_aggregierte_kurve.tsv
          curl -s -L -o amelag_einzelstandorte.tsv https://raw.githubusercontent.com/robert-koch-institut/Abwassersurveillance_AMELAG/main/amelag_einzelstandorte.tsv
          python scripts/build.py .

      - name: Commit and Push Changes if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ assets/ index.html en.html en/ amelag_aggregierte_kurve.tsv
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): automated weekly update from RKI AMELAG dataset"
            git push
          fi
